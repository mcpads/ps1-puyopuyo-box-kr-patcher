[package]
name = "ps1-puyopuyo-box"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
description = "PS1 ぷよぷよBOX (SLPS-03114) 한글 패치 빌드"

[dependencies]
encoding_rs = "0.8.35"
fontdue = "0.9"
psx-r3000a = { git = "https://github.com/mcpads/retro-typed-isa", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
typed-isa-core = { git = "https://github.com/mcpads/retro-typed-isa", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Rust 1.98의 자동 변환은 iterator item을 배열 참조로 바꿔 기존 parser를 깨뜨린다.
# 전역 기계 변환 대신 현재의 명시적 remainder 무시 계약을 유지한다.
chunks_exact_to_as_chunks = "allow"
